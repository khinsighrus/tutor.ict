<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIT TUTOR - Learn & Quiz</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#0f172a;color:#e2e8f0;padding:10px}
.container{max-width:1200px;margin:auto}
.header{background:linear-gradient(135deg,#0ea5e9,#6366f1);padding:22px;border-radius:18px;text-align:center;color:white}
.header h1{margin:0;letter-spacing:2px}
.card{background:#1e293b;border-radius:16px;padding:16px;margin-top:12px;border:1px solid #334155}
.tabs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:25px;border:2px solid #334155;background:#1e293b;color:#38bdf8;font-weight:700;cursor:pointer}
.tab.active{background:#38bdf8;color:#0f172a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.video-card{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:10px;cursor:pointer}
.video-card video{width:100%;height:150px;border-radius:8px;background:black;object-fit:cover}
.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:800;margin:2px}
.prog{background:#22c55e;color:black}.cyber{background:#f59e0b;color:black}.hack{background:#ef4444;color:white}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white;margin:5px 0}
.btn{padding:11px 16px;border-radius:10px;border:none;font-weight:700;cursor:pointer;margin-top:6px}
.primary{background:#38bdf8;color:#0f172a}.green{background:#22c55e;color:black}.outline{background:transparent;border:1px solid #38bdf8;color:#38bdf8}
.hidden{display:none}
.q-block{background:#0f172a;border:1px dashed #475569;padding:10px;border-radius:10px;margin:8px 0}
.layout{display:grid;grid-template-columns:1.2fr 0.8fr;gap:12px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>DIT TUTOR</h1><p>Programming | Cyber Security | Hacking</p></div>

<div class="tabs">
<button class="tab active" id="t1" onclick="showTab('student')">🎓 Student View</button>
<button class="tab" id="t2" onclick="showTab('tutor')">🧑‍🏫 Tutor Upload</button>
<button class="tab" id="t3" onclick="showTab('admin')">📊 Results</button>
</div>

<!-- STUDENT -->
<div id="studentTab">
<div class="card">
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="outline" onclick="filterCat('all')">All</button>
<button class="outline" onclick="filterCat('Programming')">Programming</button>
<button class="outline" onclick="filterCat('Cyber Security')">Cyber Security</button>
<button class="outline" onclick="filterCat('Hacking')">Hacking</button>
</div>
<div class="grid" id="studentGrid" style="margin-top:12px"></div>
</div>

<div id="watchSection" class="card hidden">
<h3 id="watchTitle"></h3>
<p id="watchDesc" style="color:#94a3b8;font-size:13px"></p>
<video id="watchVideo" controls style="width:100%;max-height:420px;background:black;border-radius:12px"></video>
<div style="margin-top:10px"><span id="watchCat" class="badge"></span> <small id="watchTime"></small></div>
<hr>
<h3>📝 Quiz - Answer Based On Video</h3>
<p style="font-size:12px;color:#fbbf24">You must watch at least 80% and answer all questions to complete.</p>
<div id="quizArea"></div>
<button class="btn primary" onclick="submitQuiz()">Submit Answers</button>
<button class="btn outline" onclick="closeWatch()">Close</button>
<div id="quizResult" class="hidden card"></div>
</div>
</div>

<!-- TUTOR -->
<div id="tutorTab" class="hidden">
<div class="layout">
<div class="card">
<h3>Upload New Lesson</h3>
<input id="vTitle" placeholder="Video Title e.g. Python for Beginners">
<select id="vCat"><option value="Programming">Programming</option><option value="Cyber Security">Cyber Security</option><option value="Hacking">Hacking</option></select>
<textarea id="vDesc" placeholder="Video Description / What students will learn"></textarea>
<label style="font-size:12px">Upload Video File (MP4):</label>
<input type="file" id="vFile" accept="video/*">
<p style="font-size:11px;color:#94a3b8">Video saved in browser only (No backend). Keep file < 80MB for demo.</p>
<hr>
<h4>Questions</h4>
<div id="qBuilder"></div>
<button class="btn outline" onclick="addQuestion('objective')">+ Add Objective Question</button>
<button class="btn outline" onclick="addQuestion('theory')">+ Add Theory Question</button>
<hr>
<button class="btn primary" style="width:100%" onclick="saveLesson()">🚀 Publish Lesson</button>
<p id="uploadMsg" style="font-size:12px;color:#22c55e"></p>
</div>
<div class="card">
<h3>My Lessons (<span id="lessonCount">0</span>)</h3>
<div id="tutorList"></div>
</div>
</div>
</div>

<!-- ADMIN RESULTS -->
<div id="adminTab" class="hidden card">
<h3>Student Results</h3>
<input id="searchResult" placeholder="Search student / video" oninput="renderResults()">
<div id="resultsList" style="margin-top:10px"></div>
<button class="btn primary" onclick="clearAll()" style="background:#ef4444;color:white">Clear All Data</button>
</div>

</div>

<script>
let lessons = JSON.parse(localStorage.getItem('dit_lessons')||'[]');
let results = JSON.parse(localStorage.getItem('dit_results')||'[]');
let filter='all'; let currentLesson=null; let qTemp=[];

function save(){ localStorage.setItem('dit_lessons',JSON.stringify(lessons)); localStorage.setItem('dit_results',JSON.stringify(results)); }

function showTab(t){
 document.getElementById('studentTab').classList.add('hidden');
 document.getElementById('tutorTab').classList.add('hidden');
 document.getElementById('adminTab').classList.add('hidden');
 document.getElementById('t1').classList.remove('active'); document.getElementById('t2').classList.remove('active'); document.getElementById('t3').classList.remove('active');
 if(t=='student'){document.getElementById('studentTab').classList.remove('hidden');document.getElementById('t1').classList.add('active'); renderStudent();}
 if(t=='tutor'){document.getElementById('tutorTab').classList.remove('hidden');document.getElementById('t2').classList.add('active'); renderTutor();}
 if(t=='admin'){document.getElementById('adminTab').classList.remove('hidden');document.getElementById('t3').classList.add('active'); renderResults();}
}
function filterCat(c){filter=c; renderStudent();}

function addQuestion(type){
 let id=Date.now()+Math.random();
 if(type=='objective'){
  qTemp.push({id,type,question:"",options:["","","",""],answer:0});
 }else{
  qTemp.push({id,type,question:"",answerText:""});
 }
 renderQBuilder();
}
function renderQBuilder(){
 let div=document.getElementById('qBuilder'); div.innerHTML='';
 qTemp.forEach((q,i)=>{
  if(q.type=='objective'){
   div.innerHTML+=`<div class="q-block"><b>Objective ${i+1}</b> <button onclick="removeQ(${i})" style="float:right;background:#ef4444;color:white;border:none;border-radius:6px">x</button>
   <input placeholder="Question" value="${q.question}" oninput="qTemp[${i}].question=this.value">
   <input placeholder="Option A" value="${q.options[0]}" oninput="qTemp[${i}].options[0]=this.value">
   <input placeholder="Option B" value="${q.options[1]}" oninput="qTemp[${i}].options[1]=this.value">
   <input placeholder="Option C" value="${q.options[2]}" oninput="qTemp[${i}].options[2]=this.value">
   <input placeholder="Option D" value="${q.options[3]}" oninput="qTemp[${i}].options[3]=this.value">
   <select onchange="qTemp[${i}].answer=parseInt(this.value)"><option value="0" ${q.answer==0?'selected':''}>Correct = A</option><option value="1" ${q.answer==1?'selected':''}>Correct = B</option><option value="2" ${q.answer==2?'selected':''}>Correct = C</option><option value="3" ${q.answer==3?'selected':''}>Correct = D</option></select>
   </div>`;
  }else{
   div.innerHTML+=`<div class="q-block"><b>Theory ${i+1}</b> <button onclick="removeQ(${i})" style="float:right;background:#ef4444;color:white;border:none;border-radius:6px">x</button>
   <textarea placeholder="Theory Question" oninput="qTemp[${i}].question=this.value">${q.question}</textarea>
   <textarea placeholder="Expected Answer / Keywords for auto-mark" oninput="qTemp[${i}].answerText=this.value">${q.answerText}</textarea>
   <small style="color:#94a3b8">Theory will be marked if student includes keywords.</small>
   </div>`;
  }
 });
}
function removeQ(i){ qTemp.splice(i,1); renderQBuilder(); }

function saveLesson(){
 let title=document.getElementById('vTitle').value.trim();
 let cat=document.getElementById('vCat').value;
 let desc=document.getElementById('vDesc').value.trim();
 let file=document.getElementById('vFile').files[0];
 if(!title||!file){ alert('Enter title and video'); return; }
 if(qTemp.length==0){ alert('Add at least 1 question'); return; }
 let reader=new FileReader();
 reader.onload=function(e){
  let lesson={id:'LES-'+Date.now(),title,cat,desc,videoData:e.target.result,questions:[...qTemp],date:new Date().toLocaleString()};
  lessons.push(lesson); save();
  document.getElementById('uploadMsg').innerText='Published! '+title;
  document.getElementById('vTitle').value=''; document.getElementById('vDesc').value=''; document.getElementById('vFile').value=''; qTemp=[]; renderQBuilder(); renderTutor();
 };
 reader.readAsDataURL(file);
}

function renderTutor(){
 document.getElementById('lessonCount').innerText=lessons.length;
 let div=document.getElementById('tutorList'); div.innerHTML='';
 if(lessons.length==0){div.innerHTML='<p style="color:#64748b">No lessons yet</p>'; return;}
 lessons.slice().reverse().forEach(l=>{
  div.innerHTML+=`<div class="video-card" style="margin-top:8px"><b>${l.title}</b><br><span class="badge ${l.cat=='Programming'?'prog':l.cat=='Cyber Security'?'cyber':'hack'}">${l.cat}</span> <small>${l.questions.length} questions</small><br><small style="color:#94a3b8">${l.date}</small><br><button class="btn outline" style="padding:5px 10px" onclick="deleteLesson('${l.id}')">Delete</button></div>`;
 });
}
function deleteLesson(id){ if(confirm('Delete lesson?')){ lessons=lessons.filter(l=>l.id!==id); save(); renderTutor(); renderStudent(); } }

function renderStudent(){
 let grid=document.getElementById('studentGrid'); grid.innerHTML='';
 let list= lessons.filter(l=> filter=='all' || l.cat==filter);
 if(list.length==0){grid.innerHTML='<p style="color:#64748b">No videos in this category yet. Tutor should upload.</p>'; return;}
 list.slice().reverse().forEach(l=>{
  grid.innerHTML+=`<div class="video-card" onclick="openWatch('${l.id}')"><video src="${l.videoData}" muted></video><h4 style="margin:6px 0">${l.title}</h4><span class="badge ${l.cat=='Programming'?'prog':l.cat=='Cyber Security'?'cyber':'hack'}">${l.cat}</span><br><small style="color:#94a3b8">${l.questions.length} quiz questions | ${l.desc.substring(0,60)}</small></div>`;
 });
}

let watchedEnough=false;
function openWatch(id){
 currentLesson=lessons.find(l=>l.id===id);
 document.getElementById('watchSection').classList.remove('hidden');
 document.getElementById('watchTitle').innerText=currentLesson.title;
 document.getElementById('watchDesc').innerText=currentLesson.desc;
 document.getElementById('watchCat').innerText=currentLesson.cat;
 document.getElementById('watchCat').className='badge '+(currentLesson.cat=='Programming'?'prog':currentLesson.cat=='Cyber Security'?'cyber':'hack');
 document.getElementById('watchTime').innerText=currentLesson.date;
 let video=document.getElementById('watchVideo');
 video.src=currentLesson.videoData; watchedEnough=false;
 video.onTimeUpdate=function(){ if(video.currentTime / video.duration > 0.8) watchedEnough=true; };
 // build quiz
 let qArea=document.getElementById('quizArea'); qArea.innerHTML='';
 currentLesson.questions.forEach((q,i)=>{
  if(q.type=='objective'){
   qArea.innerHTML+=`<div class="q-block"><b>Q${i+1} (Objective): ${q.question}</b><br>
   ${q.options.map((op,oi)=>`<label style="display:block;margin:4px 0"><input type="radio" name="q${i}" value="${oi}"> ${String.fromCharCode(65+oi)}. ${op}</label>`).join('')}
   </div>`;
  }else{
   qArea.innerHTML+=`<div class="q-block"><b>Q${i+1} (Theory): ${q.question}</b><br><textarea id="theory${i}" placeholder="Type your answer here..." rows="3"></textarea></div>`;
  }
 });
 document.getElementById('quizResult').classList.add('hidden');
 window.scrollTo({top:document.getElementById('watchSection').offsetTop,behavior:'smooth'});
}
function closeWatch(){ document.getElementById('watchSection').classList.add('hidden'); document.getElementById('watchVideo').pause(); }

function submitQuiz(){
 if(!watchedEnough){ alert('Please watch at least 80% of video before submitting'); return; }
 let score=0; let total=currentLesson.questions.length; let details=[];
 currentLesson.questions.forEach((q,i)=>{
  if(q.type=='objective'){
   let sel=document.querySelector(`input[name="q${i}"]:checked`);
   if(!sel){ details.push(`Q${i+1}: Not answered`); return; }
   let correct=parseInt(sel.value)===q.answer;
   if(correct) score++;
   details.push(`Q${i+1}: ${correct?'Correct':'Wrong'} (Your: ${String.fromCharCode(65+parseInt(sel.value))} | Correct: ${String.fromCharCode(65+q.answer)})`);
  }else{
   let ans=(document.getElementById('theory'+i).value||'').trim();
   if(!ans){ details.push(`Q${i+1}: Not answered`); return; }
   // simple keyword check
   let keywords=q.answerText.toLowerCase().split(/[, ]+/).filter(k=>k.length>3);
   let matches=keywords.filter(k=> ans.toLowerCase().includes(k)).length;
   let passed = keywords.length==0 ? ans.length>20 : matches>=Math.ceil(keywords.length*0.4);
   if(passed) score++;
   details.push(`Q${i+1} Theory: ${passed?'Passed':'Needs review'} - Matched ${matches}/${keywords.length} keywords`);
  }
 });
 let percent=Math.round((score/total)*100);
 let studentName=prompt('Enter your Name for result:','Student');
 if(!studentName) return;
 let studentId=prompt('Enter your Student ID:','DIT001');
 let res={id:'RES-'+Date.now(),lessonId:currentLesson.id,lessonTitle:currentLesson.title,cat:currentLesson.cat,studentName,studentId,score,total,percent,details,date:new Date().toLocaleString()};
 results.push(res); save();
 let resultDiv=document.getElementById('quizResult');
 resultDiv.classList.remove('hidden');
 resultDiv.innerHTML=`<h3>Result: ${score}/${total} (${percent}%)</h3><p><b>${percent>=50?'PASSED ✅':'FAILED ❌ - Rewatch recommended'}</b></p><ul style="font-size:13px">${details.map(d=>`<li>${d}</li>`).join('')}</ul>`;
 renderResults();
}

function renderResults(){
 let list=document.getElementById('resultsList'); let q=(document.getElementById('searchResult').value||'').toLowerCase();
 let filtered=results.filter(r=> r.studentName.toLowerCase().includes(q) || r.lessonTitle.toLowerCase().includes(q) || r.studentId.toLowerCase().includes(q));
 if(filtered.length==0){list.innerHTML='<p style="color:#64748b">No results yet</p>'; return;}
 list.innerHTML=filtered.slice().reverse().map(r=>`<div class="video-card" style="margin-top:8px"><b>${r.lessonTitle}</b> <span class="badge ${r.cat=='Programming'?'prog':r.cat=='Cyber Security'?'cyber':'hack'}">${r.cat}</span><br>Name: ${r.studentName} (${r.studentId})<br>Score: <b>${r.score}/${r.total} (${r.percent}%)</b><br><small>${r.date}</small><br><small>${r.details.join(' | ')}</small></div>`).join('');
}
function clearAll(){ if(confirm('Clear ALL lessons and results?')){ lessons=[]; results=[]; save(); renderTutor(); renderStudent(); renderResults(); } }

renderStudent(); renderTutor(); renderQBuilder();
</script>
</body>
</html>
